<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admixa - make admin password hash</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;color:#1E1B4B}input,button{font:16px system-ui;padding:10px 12px;border-radius:10px;border:1px solid #DDD6FE;width:100%;box-sizing:border-box;margin:6px 0}button{background:#7C3AED;color:#fff;border:0;cursor:pointer}code{display:block;word-break:break-all;background:#F5F3FF;padding:12px;border-radius:10px;margin-top:10px}</style></head>
<body><h2>Admixa admin password</h2><p>Type a new password. Copy the hash into <b>js/config.js</b> → <b>adminPasswordSha256</b>. The password itself is never stored.</p>
<input id="p" type="password" placeholder="New admin password (min 8 characters)"><button id="b">Make hash</button><code id="o">—</code>
<script>document.getElementById('b').onclick=async()=>{const p=document.getElementById('p').value;if(p.length<8){document.getElementById('o').textContent='Use at least 8 characters.';return;}const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));document.getElementById('o').textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');};</script></body></html>

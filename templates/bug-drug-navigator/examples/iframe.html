<!-- Hulool web: embed Spectra and receive its usage events -->
<iframe id="spectra" src="/tools/spectra/index.html?uid=HGH-PH-0042&role=pharmacist&site=HGH&app=3.1.0"
        title="Spectra — bug–drug spectrum navigator"
        style="width:100%;height:90vh;border:0;border-radius:12px"></iframe>
<script>
  const frame = document.getElementById("spectra");
  const SPECTRA_ORIGIN = location.origin;            // same origin when served from /tools/spectra/

  window.addEventListener("message", (e) => {
    if (e.origin !== SPECTRA_ORIGIN || e.source !== frame.contentWindow) return;
    const m = e.data;
    if (!m || m.source !== "spectra") return;
    if (m.type === "ready") {
      // identity can also be (re)sent at any time, e.g. after login
      frame.contentWindow.postMessage({ source: "hulool", type: "spectra:setUser",
        userId: "HGH-PH-0042", role: "pharmacist", site: "HGH", appVersion: "3.1.0" }, SPECTRA_ORIGIN);
    }
    if (m.type === "event") {
      // forward to the Hulool backend with the user's existing session
      navigator.sendBeacon("/api/spectra/events",
        new Blob([JSON.stringify({ events: [m.event] })], { type: "application/json" }));
    }
    if (m.type === "summary") console.log("Spectra summary", m.summary);
  });

  // SYSTEM ADMINISTRATORS ONLY — call after Hulool's own login has confirmed the role.
  // Requires config.js analytics.parentOrigin = your exact Hulool origin (grant requests are refused with "*").
  function grantSpectraAdmin(session) {
    if (session.role !== "sysadmin") return;
    frame.contentWindow.postMessage({ source: "hulool", type: "spectra:grantAdmin",
      role: "sysadmin", user: session.staffCode, token: session.token }, SPECTRA_ORIGIN);
  }
  // usage panel: frame.contentWindow.postMessage({source:"hulool", type:"spectra:openPanel"}, SPECTRA_ORIGIN);
</script>
